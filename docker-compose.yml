version: '3.8'

networks:
  kyc-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://agentless-video-kyc-backend:3000}
    ports:
      - "5173:5173"
    restart: unless-stopped
    container_name: agentless-video-kyc-frontend
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
